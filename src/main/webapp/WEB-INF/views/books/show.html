<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Book</title>
</head>
<body>
<p th:text="${book.getName() + ', ' + book.getAuthor() + ', ' + book.getPostYear()}">VALUE</p>
<br/>

<div th:if="${owner}">
    <span> Book is currently with: </span> <span th:text="${owner.getFullName()}">Person Name</span>

    <form th:method="PATCH" th:action="@{/books/{id}/release(id=${book.getId()})}">
    <input type="submit"
           value="Release the book"/>
    </form>
</div>

<div th:if="${people}">
    <span>This book is available. Who should be assigned to it?</span>
    <form th:method="PATCH" th:action="@{/books/{id}/assign(id=${book.getId()})}" >
        <label for="person">Select person</label>
        <select th:object="${person}" th:field="*{id}" id="person">
            <option th:each="person : ${people}" th:value="${person.getId()}" th:text="${person.getFullName()}"></option>
            <input type="submit" value="Set person to Book"/>
        </select>
    </form>
</div>

<br/>
<hr/>

<form th:method="GET" th:action="@{/books/{id}/edit(id=${book.getId()})}">
    <input type="submit" value="Edit">
</form>

<form th:method="DELETE" th:action="@{/books/{id}(id=${book.getId()})}">
    <input type="submit" value="Delete">
</form>

<form th:method="GET" th:action="@{/books}">
    <input type="submit" value="Back">
</form>

</body>
</html>
